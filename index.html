  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

      min-height: 100vh;
    }
    section { padding: 3.5rem 1.5rem; }
    @media(min-width:768px){ section { padding: 4.5rem 2.5rem; } }
    h1,h2,h3 { color: var(--green); margin-top: 0; }

    /* PRZYCISKI */
    .btn, .btn-o {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .75rem 1.4rem; border-radius: 999px;
      font-weight: 600; font-size: .98rem; text-decoration: none;
      border: none; cursor: pointer;
      transition: transform .12s, box-shadow .12s, background .12s;
    }
    .btn {
      background: linear-gradient(135deg, var(--green), #163329);
      color: #fff; box-shadow: var(--sh-lg);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 18px 40px rgba(0,0,0,.12); background: linear-gradient(135deg,#163329,#10241d); }
    .btn-o {
      background: rgba(255,255,255,.5); color: var(--green);
      border: 1px solid rgba(33,79,59,.18); backdrop-filter: blur(6px);
    }
    .btn-o:hover { background: rgba(255,255,255,.85); }

    /* NAVBAR */
    #navbar {
      position: sticky; top: 0; z-index: 999; width: 100%;
      background: rgba(247,242,232,.75);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(33,79,59,.1);
      transition: box-shadow .2s, background .2s;
    }
    #navbar.scrolled { background: rgba(247,242,232,.97); box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .nav-inner {
      max-width: 1120px; margin: 0 auto; padding: .7rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; position: relative;
    }
    .nav-brand { display: flex; align-items: center; gap: .65rem; text-decoration: none; flex-shrink: 0; }
    .nav-logo { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; }
    .nav-name { display: flex; flex-direction: column; line-height: 1.2; }
    .nav-name strong { font-size: .9rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--green); }
    .nav-name span { font-size: .7rem; color: var(--muted); }
    .nav-links { display: none; align-items: center; gap: .2rem; }
    .nav-links a { font-size: .9rem; font-weight: 500; color: var(--green); text-decoration: none; padding: .4rem .7rem; border-radius: 8px; transition: background .15s; }
    .nav-links a:hover { background: rgba(33,79,59,.07); }
    .nav-links .nav-wa {
      margin-left: .6rem; padding: .45rem 1rem; border-radius: 999px;
      background: linear-gradient(135deg, var(--green), #163329);
      color: #fff !important; font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      transition: transform .12s, box-shadow .12s;
    }
    .nav-links .nav-wa:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0,0,0,.16); }
    .hamburger {
      display: flex; flex-direction: column; justify-content: center;
      gap: 5px; width: 36px; height: 36px; padding: 6px;
      border: none; background: transparent; cursor: pointer;
      border-radius: 8px; transition: background .15s;
    }
    .hamburger:hover { background: rgba(33,79,59,.07); }
    .hamburger span {
      display: block; width: 100%; height: 2px;
      background: var(--green); border-radius: 2px;
      transition: transform .22s, opacity .22s; transform-origin: center;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-links.open {
      display: flex !important; flex-direction: column; align-items: stretch;
      position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(247,242,232,.98);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(33,79,59,.1);
      padding: .8rem 1.5rem 1rem; gap: .2rem;
      box-shadow: 0 12px 32px rgba(0,0,0,.1);
      animation: slideIn .18s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .nav-links.open a { padding: .6rem .8rem; font-size: 1rem; border-radius: 10px; color: var(--green) !important; }
    .nav-links.open .nav-wa { margin-left: 0; margin-top: .4rem; text-align: center; color: #fff !important; }
    @media(min-width:768px){ .nav-links { display: flex; } .hamburger { display: none; } }

    /* HERO */
    #hero { max-width: 960px; margin: 0 auto; padding-top: 3rem; padding-bottom: 2rem; }
    .eyebrow { display: block; font-size: .82rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: .7rem; }
    #hero h1 { font-size: 2rem; line-height: 1.2; margin-bottom: 1rem; }
    .hero-lead { font-size: 1rem; color: var(--muted); max-width: 40rem; margin-bottom: 1.8rem; line-height: 1.65; }
    .hero-btns { display: flex; flex-wrap: wrap; gap: .8rem; }
    @media(max-width:640px){
      #hero h1 { font-size: 1.6rem; }
      .hero-btns { flex-direction: column; align-items: stretch; }
      .btn, .btn-o { width: 100%; justify-content: center; }
    }

    /* KORZYŚCI */
    #benefits {
      max-width: 960px; margin: 0 auto; padding-top: 0; padding-bottom: 2.5rem;

    }
    .benefit { background: rgba(255,255,255,.85); border-radius: var(--r-md); padding: 1.1rem 1.2rem; box-shadow: var(--sh); border: 1px solid rgba(201,139,47,.08); }
    .benefit h3 { font-size: .95rem; margin-bottom: .35rem; }
    .benefit p { font-size: .88rem; color: var(--muted); line-height: 1.55; }
    @media(min-width:768px){ #benefits { grid-template-columns: repeat(3,1fr); gap: 1.1rem; } }

    /* OFERTA */
    #oferta { max-width: 1120px; margin: 0 auto; }
    #oferta h2 { font-size: 1.5rem; margin-bottom: .5rem; }
    #oferta > p { max-width: 44rem; color: var(--muted); font-size: .96rem; line-height: 1.6; }
    .pgrid { margin-top: 2rem; display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    .pcard { background: var(--bg-light); border-radius: var(--r-lg); padding: 1.4rem; box-shadow: var(--sh); border: 1px solid rgba(33,79,59,.08); }
    .pcard.featured { border: 1px solid rgba(201,139,47,.3); box-shadow: 0 18px 50px rgba(0,0,0,.12); background: radial-gradient(circle at top left, #fffaf2 0, #fff 42%, #f6efe3 100%); }
    .ptag { display: inline-flex; padding: .18rem .65rem; border-radius: 999px; background: rgba(201,139,47,.1); color: var(--gold); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; margin-bottom: .55rem; }
    .pcard h3 { font-size: 1.1rem; margin-bottom: .3rem; }
    .psub { font-size: .88rem; color: var(--muted); margin-bottom: .7rem; line-height: 1.5; }
    .pprice { font-size: 1.1rem; font-weight: 700; color: var(--green); margin-bottom: .8rem; }
    .plist { list-style: none; padding: 0; }
    .plist li { font-size: .88rem; padding-left: 1.2rem; position: relative; margin-bottom: .4rem; line-height: 1.55; }
    .plist li::before { content:""; width:6px; height:6px; border-radius:999px; background:var(--gold); position:absolute; left:.25rem; top:.5rem; }
    @media(min-width:768px){ .pgrid { grid-template-columns: repeat(3,1fr); gap: 1.5rem; } }

    /* CENNIK */
    #cennik { max-width: 960px; margin: 0 auto; }
    #cennik h2 { font-size: 1.5rem; margin-bottom: .5rem; }
    #cennik > p { max-width: 40rem; color: var(--muted); font-size: .96rem; }
    .pricelist { margin-top: 1.5rem; display: grid; grid-template-columns: 1fr; gap: .9rem; }

    .prow h3 { font-size: .96rem; margin: 0; }

    @media(min-width:768px){ .pricelist { grid-template-columns: repeat(3,1fr); } }

    #kontakt h2 { font-size: 1.4rem; margin-bottom: .6rem; }
    #kontakt p { color: var(--muted); font-size: .96rem; margin-bottom: 1rem; line-height: 1.65; }

    /* STOPKA */
    #footer { margin-top: 3rem; padding: 2.5rem 1.5rem 1.8rem; background: radial-gradient(circle at top, #1f3c2f 0, #11251c 60%, #0b1712 100%); color: #f7f2e8; }
    .fi { max-width: 1120px; margin: 0 auto 1.5rem; display: flex; flex-direction: column; gap: 1.8rem; }
    .fbrand p { font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: .92rem; }
    .fbrand span { display: block; margin-top: .3rem; font-size: .88rem; color: rgba(247,242,232,.65); }
    .fcols { display: flex; flex-direction: column; gap: 1.5rem; }
    .fcol h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; color: rgba(247,242,232,.85); margin-bottom: .5rem; }
    .fcol p { font-size: .88rem; color: rgba(247,242,232,.65); line-height: 1.75; }
    .flinks a { color: rgba(247,242,232,.85); text-decoration: none; position: relative; padding-bottom: 1px; }
    .flinks a::after { content:""; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--gold); transition:width .18s; }
    .flinks a:hover::after { width: 100%; }
    .fbot { max-width: 1120px; margin: 0 auto; border-top: 1px solid rgba(247,242,232,.14); padding-top: .9rem; display: flex; flex-direction: column; gap: .2rem; }
    .fbot p { margin: 0; font-size: .78rem; color: rgba(247,242,232,.5); }
    .fbot .fn { font-style: italic; }
    @media(min-width:768px){
      #footer { padding: 3rem 2.5rem 2.2rem; }
      .fi { flex-direction: row; justify-content: space-between; align-items: flex-start; }
      .fcols { flex-direction: row; gap: 3rem; }
      .fbot { flex-direction: row; justify-content: space-between; align-items: center; }
    }
  </style>
