<style>
:root{--bg:#f7f2e8;--wh:#fff;--gr:#214f3b;--go:#c98b2f;--tx:#1f2724;--mu:#6b716d;--rlg:18px;--rmd:12px;--sh:0 8px 24px rgba(0,0,0,.05);--shl:0 14px 40px rgba(0,0,0,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:radial-gradient(circle at top,#fff 0,var(--bg) 50%,#f1eadf 100%);min-height:100vh;}
section{padding:3.5rem 1.5rem;}
@media(min-width:768px){section{padding:4.5rem 2.5rem;}}
h1,h2,h3{color:var(--gr);margin-top:0;}

/* PRZYCISKI */
.btn,.btn2{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.4rem;border-radius:999px;font-weight:600;font-size:.98rem;text-decoration:none;border:none;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;}
.btn{background:linear-gradient(135deg,var(--gr),#163329);color:#fff;box-shadow:var(--shl);}
.btn:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(0,0,0,.12);}
.btn2{background:rgba(255,255,255,.5);color:var(--gr);border:1px solid rgba(33,79,59,.18);backdrop-filter:blur(6px);}
.btn2:hover{background:rgba(255,255,255,.85);}

/* NAVBAR */
#nav{position:sticky;top:0;z-index:999;width:100%;background:rgba(247,242,232,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(33,79,59,.1);transition:box-shadow .2s,background .2s;}
#nav.sc{background:rgba(247,242,232,.97);box-shadow:0 4px 24px rgba(0,0,0,.08);}
.ni{max-width:1120px;margin:0 auto;padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:relative;}
